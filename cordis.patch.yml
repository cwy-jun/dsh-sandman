# 九层之台（dsh-sandman）的 bundle 补丁层。
# 由 package.json 的 dsh.bundle.patch 自动生效；profile 的 cordis.patch.yml 可按 id 覆盖。

- insert:
    - id: sandman
      name: dsh-sandman
      config:
        enabled: true
        # 数据库文件路径。空 = <DSH_HOME>/storages/dsh-sandman/sandman.db
        dbPath: ''
        # Markdown 镜像目录（人能直接看/改的目录）。空 = <DSH_HOME>/memory-vault-sandman
        vaultDir: ''
        # 快照目录。空 = <DSH_HOME>/storages/dsh-sandman/snapshots
        snapshotsDir: ''
        # ── 捕获（M2）──
        captureEnabled: true        # 自动听对话记记忆
        captureMinChars: 200        # 一轮对话最短字数才触发
        captureCooldownMs: 120000   # 冷却 2 分钟
        maxCapturesPerDay: 60       # 每日上限
        # ── 注入（M3）──
        # ⚠ 默认关：喵记忆/记忆核心已是你的注入通道，同时开多个会互相干扰。
        # 旧数据 M7 迁移进九层之台后再打开。
        injectEnabled: false
        # ── 做梦三档（M4）──
        lightEveryTurns: 8          # 轻梦：每 N 轮
        deepIdleMinutes: 30         # 深梦：空闲 N 分钟
        peakSuppress: true          # 峰时抑制（总开关）
        peakWindows:                # 峰时时段（本地时间，可增删；开始前 peakLeadMinutes 分钟也不触发）
          - { start: '09:00', end: '12:00' }
          - { start: '14:00', end: '18:00' }
        peakLeadMinutes: 15
        staleDays: 30               # 冷化：N 天未活跃…
        staleHeatMax: 0.05          # …且 heat 低于该值 → stale（失效不删除）
        # ── 画像预算（F0 层硬约束）──
        profileBudgetMax: 30
        profileBudgetChars: 200
        # ── 审核策略 ──
        auditMode: 'all'            # all=自动捕获先进待审（建议+小额自动批）none=全自动
        autoApproveLowRiskLimit: 3  # 深梦每轮最多自动批几条低风险
        # ── 馆长模型接入（M6）──
        curator:
          mode: 'dsh'               # dsh=DSH主路由 cloud=OpenAI兼容API local=本地Ollama
          baseUrl: ''
          apiKey: ''
          model: ''
        dailyTokenBudget: 100000    # 馆长日预算（token），超出熔断
